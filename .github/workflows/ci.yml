name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-and-api:
    name: Frontend and API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: floodguard-frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: floodguard-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Node regression tests
        run: npm test

      - name: Run lint checks
        run: npm run lint

      - name: Build production bundle
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run dashboard browser tests
        run: npm run test:e2e

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            floodguard-frontend/playwright-report
            floodguard-frontend/test-results
          if-no-files-found: ignore
          retention-days: 7

  ml:
    name: Python ML
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: floodguard-ml

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: floodguard-ml/requirements.txt

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Run Python tests
        run: python -m unittest discover --start-directory tests --pattern "test_*.py"
